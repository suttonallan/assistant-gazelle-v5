name: Full Gazelle Sync (Nightly)

on:
  schedule:
    # Exécuter tous les jours à 2h00 UTC (22h00 heure de Montréal la veille en hiver)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Permet d'exécuter manuellement depuis GitHub

jobs:
  sync-all-gazelle-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Timeout de 30 minutes pour la sync complète

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Vérifier que sendgrid est bien installé (requis pour les notifications)
        python -c "import sendgrid; print(f'✅ sendgrid version: {sendgrid.__version__}')" || (echo "❌ sendgrid non installé - installation forcée" && pip install sendgrid>=6.12.0)

    - name: Run full Gazelle sync
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GAZELLE_CLIENT_ID: ${{ secrets.GAZELLE_CLIENT_ID }}
        GAZELLE_CLIENT_SECRET: ${{ secrets.GAZELLE_CLIENT_SECRET }}
      run: |
        echo "🔄 Démarrage de la synchronisation complète Gazelle → Supabase"
        echo "📅 $(date)"
        echo ""
        python3 modules/sync_gazelle/sync_to_supabase.py

    - name: Generate Timeline Report
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        echo ""
        echo "📊 Génération du rapport Timeline Google Sheets"
        echo "📅 $(date)"

        # Créer le fichier credentials Google depuis le secret
        echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > /tmp/google_credentials.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/google_credentials.json

        # Générer le rapport — avec retry pour encaisser les hoquets
        # transitoires de l'API Google Sheets (qui faisaient échouer tout
        # le nightly alors que la sync, elle, avait réussi).
        n=0
        until [ "$n" -ge 3 ]; do
          python3 -c "from modules.reports.service_reports import run_reports; run_reports(append=False)" && break
          n=$((n+1))
          echo "⚠️ Rapport Timeline échoué (tentative $n/3) — nouvelle tentative dans 30s..."
          sleep 30
        done

        # Nettoyer le fichier credentials
        rm -f /tmp/google_credentials.json

        if [ "$n" -ge 3 ]; then
          echo "❌ Rapport Timeline échoué après 3 tentatives"
          exit 1
        fi

        echo "✅ Rapport Timeline généré"

    - name: 📧 Alerte email en cas d'échec
      if: failure()
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        EMAIL_FROM: asutton@piano-tek.com
        EMAIL_FROM_NAME: Alertes Sync Gazelle
        GH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        echo "❌ Une étape a échoué — envoi de l'alerte email à Allan"
        python3 -c "import os; from core.email_notifier import get_email_notifier; url=os.environ.get('GH_RUN_URL',''); ok=get_email_notifier().send_email(to_emails=['asutton@piano-tek.com'], subject='❌ Sync Gazelle nightly a ÉCHOUÉ', html_content='<h2>La synchronisation nocturne Gazelle a ÉCHOUÉ</h2><p>Une étape du job a échoué (sync Gazelle ou rapport Timeline Google Sheets).</p><p>Run : '+url+'</p>'); print('Alerte email envoyée:', ok)"

    - name: Report results
      if: always()
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Synchronisation complète terminée"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Données synchronisées:"
        echo "   • Users/Techniciens"
        echo "   • Clients"
        echo "   • Contacts"
        echo "   • Pianos"
        echo "   • Rendez-vous (Appointments)"
        echo "   • Timeline Entries"
        echo ""
        echo "📈 Consultez les logs dans le Dashboard:"
        echo "   Notifications → Tâches & Imports → Logs de synchronisation"
        echo ""
        echo "⏰ Prochaine sync automatique: demain à 2h00 UTC (22h Montréal)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
