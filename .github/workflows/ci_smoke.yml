name: CI — Smoke (compile + deps)

# Filet de securite pour les crons non surveilles : attrape une coquille de
# syntaxe ou une dependance cassee AVANT qu'un cron parte en prod et echoue en
# silence. Ne touche jamais Supabase/Gazelle (aucune execution, aucun secret).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check (syntaxe de tout le code)
        run: python -m compileall -q api core modules scripts

      - name: Garde-fou fuseau horaire (serveurs en UTC, journée = Montréal)
        # Leçon n° 1 (docs/historique/V6_LECONS_APPRISES.md) : sur Render/GitHub,
        # date.today() et un découpage f"{jour}T00:00:00" basculent au lendemain
        # dès 20 h à Montréal. Utiliser core.timezone_utils.aujourdhui_montreal()
        # et bornes_journee_utc().
        run: |
          if grep -rnE "(^|[^.[:alnum:]_])date\.today\(\)|datetime\.now\(\)\.date\(\)|datetime\.now\(\)\.strftime\(['\"]%Y-%m-%d['\"]\)|\('(occurred_at|start_datetime)', f['\"]\{[a-z_]+\}T(00:00:00|23:59:59)" api core modules --include=*.py | grep -v "core/timezone_utils.py"; then
            echo "::error::Calcul de date en UTC détecté (voir lignes ci-dessus). Utiliser aujourdhui_montreal() / bornes_journee_utc()."
            exit 1
          fi
          echo "OK : aucun calcul de journée en UTC"
