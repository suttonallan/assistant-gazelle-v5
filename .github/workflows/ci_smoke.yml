name: CI — Smoke (compile + deps)

# Filet de securite pour les crons non surveilles : attrape une coquille de
# syntaxe ou une dependance cassee AVANT qu'un cron parte en prod et echoue en
# silence. Ne touche jamais Supabase/Gazelle (aucune execution, aucun secret).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check (syntaxe de tout le code)
        run: python -m compileall -q api core modules scripts
