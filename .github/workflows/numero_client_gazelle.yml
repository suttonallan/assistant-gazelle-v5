name: Numéro client Gazelle (custom2)

# Remplit le champ personnalisé « Numéro client » (custom2) des fiches Gazelle
# avec leur identifiant cli_…, pour les liens personnels des rappels vers la page
# de réservation PTM. N'écrit que dans les champs vides.
on:
  schedule:
    - cron: '15 3 * * *'   # chaque nuit, après la synchro complète (02 h 00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "essai = compter seulement ; limite = 5 fiches ; complet = toutes les fiches vides"
        type: choice
        options: [essai, limite, complet]
        default: essai

jobs:
  remplir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Remplir le numéro client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAZELLE_CLIENT_ID: ${{ secrets.GAZELLE_CLIENT_ID }}
          GAZELLE_CLIENT_SECRET: ${{ secrets.GAZELLE_CLIENT_SECRET }}
          MODE: ${{ inputs.mode || 'complet' }}
        run: |
          case "$MODE" in
            essai)  python3 scripts/remplir_numero_client.py --essai ;;
            limite) python3 scripts/remplir_numero_client.py --limite 5 ;;
            *)      python3 scripts/remplir_numero_client.py ;;
          esac
