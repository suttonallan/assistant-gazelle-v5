name: Front - menage des vieilles conversations

# Menage UNIQUE (date limite fixe dans le script : 7 oct. 2026), TERMINE.
# Archive les conversations ouvertes sans activite depuis cette date dans
# info@ et asutton@. Archiver n'efface rien.
# Le gros du travail s'est fait du 4 au 6 nov. 2026 ; depuis, chaque passage
# archivait 0 conversation. Le declencheur horaire est donc retire (nov. 2026).
# Lancement manuel toujours possible (workflow_dispatch) s'il faut le refaire.
# Cle : secret FRONT_API_KEY (jeton « Assistant Gazelle », oct. 2026).

on:
  push:
    branches: [main]
    paths:
      - scripts/archiver_vieilles_conversations_front.py
      - .github/workflows/front_menage_archivage.yml
  workflow_dispatch:

concurrency:
  group: front-menage-archivage
  cancel-in-progress: false

jobs:
  archiver:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Archiver
        env:
          FRONT_API_KEY: ${{ secrets.FRONT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/archiver_vieilles_conversations_front.py
