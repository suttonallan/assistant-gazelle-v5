name: Test des rappels (fiche d'Allan seulement)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/test_rappel_allan.py']
jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: requirements.txt }
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAZELLE_CLIENT_ID: ${{ secrets.GAZELLE_CLIENT_ID }}
          GAZELLE_CLIENT_SECRET: ${{ secrets.GAZELLE_CLIENT_SECRET }}
        run: python scripts/test_rappel_allan.py
