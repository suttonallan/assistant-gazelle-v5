name: Verificateur quotidien des donnees

# Detecte des anomalies (stationnement double, contradictions PLS, etc.) et envoie
# un courriel a Allan UNIQUEMENT s'il y a quelque chose a signaler.

on:
  schedule:
    - cron: '0 13 * * *'   # ~8h-9h Montreal (apres le sync du matin)
  workflow_dispatch:

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily sanity check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GAZELLE_CLIENT_ID: ${{ secrets.GAZELLE_CLIENT_ID }}
          GAZELLE_CLIENT_SECRET: ${{ secrets.GAZELLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python modules/data_quality/daily_sanity_check.py

      # NOTE : le canari de sante n'est PLUS ici. Cause de l'echec quotidien :
      # ce step n'avait NI webhook Slack NI EMAIL_FROM, donc aucune alerte ne
      # pouvait etre livree -> des que le canari signalait la moindre anomalie
      # (endpoint au-dessus de son seuil de latence, blip transitoire, etc.) il
      # sortait en exit 1 -> echec. La vraie anomalie matinale n'a pas ete
      # confirmee (logs Actions en 403). Le canari vit maintenant dans son propre
      # workflow `health_canary.yml` (mode leger, /15 min en journee, Slack +
      # courriel), qui LUI peut livrer l'alerte au lieu de rougir en silence.
