name: Migrations SQL

# Applique sql/auto/*.sql (idempotent) avec la clé service-role stockée dans les
# secrets GitHub. Remplace les anciennes routes /admin/migrate (retirées).

on:
  push:
    branches: [main]
    paths:
      - 'sql/auto/**'
      - 'scripts/appliquer_migrations.py'
  workflow_dispatch:

jobs:
  migrer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Appliquer les migrations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/appliquer_migrations.py
